<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9FDFC"/>
      <stop offset="1" stop-color="#E4F2EE"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg3)"/>
  <rect x="0" y="0" width="10" height="720" fill="#2A9D8F"/>
  <text x="70" y="86" font-size="24" letter-spacing="3" fill="#1E7A6E" font-weight="700">03 · SIGNAL / BASELINE CORRECTION</text>
  <line x1="70" y1="104" x2="360" y2="104" stroke="#2A9D8F" stroke-width="3"/>

  <!-- raw signal chart -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="540" height="300" rx="14" fill="#ffffff" stroke="#CDE6E0" stroke-width="2"/>
    <text x="20" y="34" font-size="17" font-weight="700" fill="#16324F">Raw PCR 신호 + baseline drift</text>
    <!-- axes -->
    <line x1="40" y1="260" x2="510" y2="260" stroke="#B7CDC7" stroke-width="2"/>
    <line x1="40" y1="60" x2="40" y2="260" stroke="#B7CDC7" stroke-width="2"/>
    <!-- baseline drift dashed amber -->
    <path d="M40 235 Q180 250 300 225 T510 205" fill="none" stroke="#E8912D" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- raw sigmoid teal -->
    <path d="M40 232 Q200 235 300 210 Q360 180 400 110 Q440 78 510 74" fill="none" stroke="#2A9D8F" stroke-width="4"/>
    <text x="360" y="150" font-size="14" fill="#2A9D8F" font-weight="700">증폭 곡선</text>
    <text x="150" y="248" font-size="13" fill="#C97A12" font-weight="700">baseline</text>
  </g>

  <!-- arrow -->
  <g stroke="#1E7A6E" stroke-width="3" fill="#1E7A6E">
    <line x1="630" y1="300" x2="690" y2="300"/>
    <polygon points="690,293 706,300 690,307"/>
    <text x="668" y="285" font-size="14" text-anchor="middle" font-weight="700" fill="#1E7A6E">보정</text>
  </g>

  <!-- residual chart -->
  <g transform="translate(720,150)">
    <rect x="0" y="0" width="490" height="300" rx="14" fill="#ffffff" stroke="#CDE6E0" stroke-width="2"/>
    <text x="20" y="34" font-size="17" font-weight="700" fill="#16324F">차감 후 잔여신호</text>
    <line x1="40" y1="160" x2="460" y2="160" stroke="#B7CDC7" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- flat white noise green -->
    <path d="M40 160 L70 152 L95 168 L120 150 L150 170 L180 154 L210 165 L245 150 L275 168 L305 153 L335 166 L365 151 L395 167 L425 155 L460 161" fill="none" stroke="#388E3C" stroke-width="3"/>
    <rect x="150" y="215" width="200" height="46" rx="23" fill="#E7F4E8"/>
    <text x="250" y="244" font-size="17" font-weight="800" fill="#2E7D32" text-anchor="middle">White noise 근접 1위</text>
  </g>

  <text x="70" y="530" font-size="46" font-weight="800" fill="#16324F">시계열 PCR 신호 baseline 보정 최적화</text>
  <text x="70" y="570" font-size="22" fill="#5E7A74">혼합 기저함수 Data-Driven 모델 · 6개 알고리즘 비교 · 2024.01–2024.09</text>

  <g font-weight="800" text-anchor="middle">
    <rect x="70" y="606" width="200" height="66" rx="10" fill="#16324F"/>
    <text x="170" y="642" font-size="25" fill="#ffffff">91.49% ↓</text>
    <text x="170" y="662" font-size="12" fill="#9CB6CE" font-weight="500">위음성률 0.47%→0.04%</text>
    <rect x="282" y="606" width="160" height="66" rx="10" fill="#2A9D8F"/>
    <text x="362" y="642" font-size="25" fill="#ffffff">1위</text>
    <text x="362" y="662" font-size="12" fill="#CFEDE7" font-weight="500">백색잡음 근사도(5종)</text>
  </g>
</svg>
