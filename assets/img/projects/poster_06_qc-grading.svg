<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#EDF1F7"/></linearGradient>
    <linearGradient id="lstm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E6BA6"/><stop offset="1" stop-color="#16324F"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="12" fill="#2E6BA6"/>

  <text x="70" y="80" font-size="19" letter-spacing="5" fill="#2E6BA6" font-weight="700">06 · QC AUTOMATION · DEVICE PERFORMANCE GRADING</text>
  <text x="68" y="140" font-size="54" font-weight="800" fill="#16324F">진단 장비 QC 자동화 &amp; 성능 등급 분류</text>
  <text x="70" y="180" font-size="23" fill="#5A7085">수동 엑셀 QC를 LSTM 2단계 예측·등급 분류 시스템으로 자동화.</text>
  <text x="70" y="212" font-size="16" fill="#8A9AA8">Seegene 진단 IT / 데이터 사이언스 · Technical Lead &amp; Data Scientist · 다학제 11명 · 2020.12–2021.09</text>
  <line x1="70" y1="236" x2="1530" y2="236" stroke="#DCE4EC" stroke-width="1.5"/>

  <!-- LEFT -->
  <text x="70" y="292" font-size="17" letter-spacing="2" fill="#2E6BA6" font-weight="700">AS-IS · 문제</text>
  <g>
    <g transform="translate(70,308)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#2E6BA6"/><text x="22" y="32" font-size="16" font-weight="700" fill="#16324F">엑셀 수동 검사</text><text x="22" y="56" font-size="13.5" fill="#5A7085">비효율·추적 관리 불가</text></g>
    <g transform="translate(70,392)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#3E86C4"/><text x="22" y="32" font-size="16" font-weight="700" fill="#16324F">신호 증폭 왜곡</text><text x="22" y="56" font-size="13.5" fill="#5A7085">기계 결함·휴먼에러 혼동</text></g>
    <g transform="translate(70,476)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#5AA0D8"/><text x="22" y="32" font-size="16" font-weight="700" fill="#16324F">일괄 합·불 평가</text><text x="22" y="56" font-size="13.5" fill="#5A7085">신호 1개 불합격 = 전체 불합격</text></g>
    <g transform="translate(70,560)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#8AC0E8"/><text x="22" y="32" font-size="16" font-weight="700" fill="#16324F">투입 리소스 과다</text><text x="22" y="56" font-size="13.5" fill="#5A7085">현업 부담 · 지표 2종뿐</text></g>
  </g>

  <!-- CENTER -->
  <text x="410" y="292" font-size="17" letter-spacing="2" fill="#2E6BA6" font-weight="700">LSTM 2단계 예측 → 등급 분류</text>
  <g transform="translate(410,304)">
    <rect x="0" y="0" width="450" height="150" rx="14" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.8"/>
    <text x="20" y="30" font-size="15.5" font-weight="700" fill="#16324F">Step1 신호 → LSTM → Step2 결과 예측</text>
    <g transform="translate(24,54)">
      <rect x="0" y="12" width="26" height="72" rx="5" fill="#DCE8F4" stroke="#9CB6CE" stroke-width="1.5"/>
      <rect x="34" y="28" width="26" height="56" rx="5" fill="#DCE8F4" stroke="#9CB6CE" stroke-width="1.5"/>
      <rect x="68" y="20" width="26" height="64" rx="5" fill="#DCE8F4" stroke="#9CB6CE" stroke-width="1.5"/>
    </g>
    <g transform="translate(150,66)">
      <rect x="0" y="0" width="66" height="60" rx="9" fill="url(#lstm)"/><rect x="86" y="0" width="66" height="60" rx="9" fill="url(#lstm)"/><rect x="172" y="0" width="66" height="60" rx="9" fill="url(#lstm)"/>
      <text x="33" y="36" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">LSTM</text>
      <text x="119" y="36" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">LSTM</text>
      <text x="205" y="36" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">LSTM</text>
      <path d="M66 30 L86 30 M152 30 L172 30" stroke="#B9D2E8" stroke-width="3"/>
    </g>
    <g stroke="#16324F" stroke-width="3" fill="#16324F"><line x1="400" y1="96" x2="420" y2="96"/><polygon points="417,90 430,96 417,102"/></g>
    <text x="382" y="140" font-size="13" fill="#5A7085" text-anchor="middle">Fail 확실 장비만 Step2 진행</text>
  </g>
  <g transform="translate(410,494)">
    <rect x="0" y="0" width="450" height="178" rx="14" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.8"/>
    <text x="20" y="30" font-size="15.5" font-weight="700" fill="#16324F">장비 성능 등급 분포 (2,201대 전수)</text>
    <line x1="50" y1="150" x2="430" y2="150" stroke="#C6D2DE" stroke-width="1.8"/>
    <g text-anchor="middle" font-weight="800">
      <rect x="78" y="138" width="66" height="12" fill="#2E7D32"/><text x="111" y="128" font-size="13" fill="#2E7D32">7.0%</text><text x="111" y="170" font-size="15" fill="#3A4A5A">A+</text>
      <rect x="176" y="128" width="66" height="22" fill="#2E6BA6"/><text x="209" y="118" font-size="13" fill="#2E6BA6">12.9%</text><text x="209" y="170" font-size="15" fill="#3A4A5A">A</text>
      <rect x="274" y="42" width="66" height="108" fill="#E8912D"/><text x="307" y="34" font-size="13" fill="#B07A2B">75.7%</text><text x="307" y="170" font-size="15" fill="#3A4A5A">B</text>
      <rect x="372" y="142" width="66" height="8" fill="#C0392B"/><text x="405" y="132" font-size="13" fill="#C0392B">4.4%</text><text x="405" y="170" font-size="15" fill="#3A4A5A">F</text>
    </g>
  </g>

  <!-- RIGHT -->
  <text x="1030" y="292" font-size="18" letter-spacing="2" fill="#2E6BA6" font-weight="700">솔루션</text>
  <g>
    <g transform="translate(1030,304)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#2E6BA6"/><text x="24" y="34" font-size="19" font-weight="800" fill="#16324F">Data Engineering</text><text x="24" y="60" font-size="15" fill="#5A7085">산재 Excel → ETL 통합 (2,201대·61,248 신호)</text></g>
    <g transform="translate(1030,398)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#3E86C4"/><text x="24" y="34" font-size="19" font-weight="800" fill="#16324F">차등 등급 평가</text><text x="24" y="60" font-size="15" fill="#5A7085">10종 지표 → A+/A/B/F (F만 불합격), 에러 신호 배제</text></g>
    <g transform="translate(1030,492)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#5AA0D8"/><text x="24" y="34" font-size="19" font-weight="800" fill="#16324F">Step1 → Step2 예측</text><text x="24" y="60" font-size="15" fill="#5A7085">LSTM 예측 + 자동 분석 웹 대시보드</text></g>
  </g>
  <g transform="translate(1030,594)"><rect width="500" height="78" rx="14" fill="#E8F0DE" stroke="#5C9A3A" stroke-width="1.8"/><text x="24" y="32" font-size="14" letter-spacing="2" fill="#4A7A2A" font-weight="700">수상 · 특허</text><text x="24" y="60" font-size="16" fill="#2E4A18" font-weight="600">총괄장 R&amp;D 부문 우수상 · 제1발명가 특허 2건 출원</text></g>

  <!-- METRICS -->
  <rect x="70" y="720" width="1460" height="116" rx="16" fill="#F1F5FA" stroke="#DCE4EC" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="252" y="778" font-size="38" font-weight="800" fill="#16324F">93% ↓</text><text x="252" y="810" font-size="15" fill="#5A7085">QC 400h → 28h / 100대</text>
    <line x1="435" y1="748" x2="435" y2="808" stroke="#DCE4EC" stroke-width="1.5"/>
    <text x="617" y="778" font-size="38" font-weight="800" fill="#2E6BA6">13배</text><text x="617" y="810" font-size="15" fill="#5A7085">연간 운영비 절감</text>
    <line x1="800" y1="748" x2="800" y2="808" stroke="#DCE4EC" stroke-width="1.5"/>
    <text x="982" y="778" font-size="38" font-weight="800" fill="#2E7D32">94.5%</text><text x="982" y="810" font-size="15" fill="#5A7085">합·불합격 분류 정확도</text>
    <line x1="1165" y1="748" x2="1165" y2="808" stroke="#DCE4EC" stroke-width="1.5"/>
    <text x="1347" y="778" font-size="36" font-weight="800" fill="#E8912D">61,248</text><text x="1347" y="810" font-size="15" fill="#5A7085">신호 데이터 (2,201대)</text>
  </g>

  <!-- TECH -->
  <text x="70" y="888" font-size="15" letter-spacing="3" fill="#8A9AA8" font-weight="700">TECH STACK</text>
  <g font-size="17" fill="#3C4C5C" font-weight="600">
    <text x="70" y="928">PyTorch (LSTM)</text><text x="265" y="928">scikit-learn</text><text x="415" y="928">Isolation Forest</text><text x="610" y="928">PCA · t-SNE · DBSCAN</text><text x="890" y="928">R Shiny</text><text x="1005" y="928">QC Data ETL</text><text x="1170" y="928">시계열 분해</text>
  </g>
  <g fill="#2E6BA6"><circle cx="58" cy="923" r="3"/><circle cx="253" cy="923" r="3"/><circle cx="403" cy="923" r="3"/><circle cx="598" cy="923" r="3"/><circle cx="878" cy="923" r="3"/><circle cx="993" cy="923" r="3"/><circle cx="1158" cy="923" r="3"/></g>
</svg>
