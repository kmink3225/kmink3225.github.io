    <g stroke="#2E7BC4" stroke-width="9" fill="none" opacity="0.20">
      <path d="M700 460 L560 350"/><path d="M700 460 L840 350"/>
      <path d="M700 460 L560 575"/><path d="M700 460 L840 575"/>
    </g>
    <g stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M700 460 L560 350"/><path d="M700 460 L840 350"/>
      <path d="M700 460 L560 575"/><path d="M700 460 L840 575"/>
    </g>
    <circle cx="630" cy="405" r="3.5" fill="#38D6C8"/><circle cx="770" cy="405" r="3.5" fill="#38D6C8"/>
    <circle cx="630" cy="518" r="3.5" fill="#38D6C8"/><circle cx="770" cy="518" r="3.5" fill="#38D6C8"/>

