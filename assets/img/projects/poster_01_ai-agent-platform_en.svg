      <rect x="0" y="0" width="5" height="86" rx="2.5" fill="#38D6C8"/>
      <text x="24" y="34" font-size="19" font-weight="800" fill="#FFFFFF">Self-RAG / CRAG loop</text>
      <text x="24" y="62" font-size="15" fill="#9FC4E6">9 sub-agents self-retrieve, verify, correct, cite</text>
    </g>
    <g transform="translate(1030,398)">
      <rect x="0" y="0" width="500" height="86" rx="12" fill="#0E2842" stroke="#22456B" stroke-width="1.5"/>
      <rect x="0" y="0" width="5" height="86" rx="2.5" fill="#4FA3E3"/>
      <text x="24" y="34" font-size="19" font-weight="800" fill="#FFFFFF">Hybrid engine</text>
      <text x="24" y="62" font-size="15" fill="#9FC4E6">300+ rules + ALBERT domain classifier + RAG</text>
