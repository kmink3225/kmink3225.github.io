<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1424"/>
      <stop offset="0.55" stop-color="#0B1B30"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1E5A8C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B1B30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7BC4"/>
      <stop offset="1" stop-color="#14375C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38D6C8"/>
      <stop offset="1" stop-color="#4FA3E3"/>
