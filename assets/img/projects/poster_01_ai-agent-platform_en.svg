      <text x="216" y="832" font-size="15" fill="#9FC4E6">QnA user satisfaction</text>
    </g>
    <line x1="362" y1="770" x2="362" y2="832" stroke="#1E4368" stroke-width="1.5"/>
    <g>
      <text x="508" y="800" font-size="40" font-weight="800" fill="#4FA3E3">4.66s</text>
      <text x="508" y="832" font-size="15" fill="#9FC4E6">Avg response time</text>
    </g>
    <line x1="654" y1="770" x2="654" y2="832" stroke="#1E4368" stroke-width="1.5"/>
    <g>
      <text x="800" y="800" font-size="40" font-weight="800" fill="#FFFFFF">2 mo</text>
      <text x="800" y="832" font-size="15" fill="#9FC4E6">Ahead of target</text>
    </g>
    <line x1="946" y1="770" x2="946" y2="832" stroke="#1E4368" stroke-width="1.5"/>
    <g>
