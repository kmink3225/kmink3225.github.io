  <!-- ===== HEADER ===== -->
  <text x="70" y="72" font-size="20" letter-spacing="6" fill="#38D6C8" font-weight="700">ENTERPRISE AI · MULTI-AGENT RAG PLATFORM</text>
  <text x="68" y="132" font-size="58" font-weight="800" fill="#FFFFFF">Enterprise AI Agent Knowledge Platform</text>
  <text x="70" y="172" font-size="24" fill="#9FC4E6">One orchestrator, many specialists — fragmented org knowledge into grounded answers.</text>
  <text x="70" y="205" font-size="17" fill="#5E7C99">Seegene SW Institute, Core Dev Team · Technical Lead / AI Architect · core team of 3 + Microsoft · 2025.11–Present</text>
  <line x1="70" y1="228" x2="1530" y2="228" stroke="#1B3A5C" stroke-width="1.5"/>

  <!-- ===== LEFT: INPUT SOURCES ===== -->
  <text x="70" y="286" font-size="18" letter-spacing="3" fill="#7FA6C9" font-weight="700">INPUT · FRAGMENTED</text>
  <g font-size="18" fill="#CFE0F0">
    <g transform="translate(70,312)">
      <rect x="0" y="0" width="230" height="52" rx="10" fill="#0F2842" stroke="#22456B" stroke-width="1.5"/>
      <rect x="16" y="16" width="20" height="20" rx="4" fill="none" stroke="#4FA3E3" stroke-width="2.5"/>
      <text x="52" y="33" font-weight="600">Miro · Notion · Loop</text>
    </g>
    <g transform="translate(70,376)">
      <rect x="0" y="0" width="230" height="52" rx="10" fill="#0F2842" stroke="#22456B" stroke-width="1.5"/>
      <path d="M26 16 a10 10 0 1 0 0.01 0 M20 40 q6 -8 12 0" fill="none" stroke="#4FA3E3" stroke-width="2.5"/>
      <text x="52" y="33" font-weight="600">GitHub repos</text>
    </g>
    <g transform="translate(70,440)">
      <rect x="0" y="0" width="230" height="52" rx="10" fill="#0F2842" stroke="#22456B" stroke-width="1.5"/>
      <rect x="16" y="15" width="22" height="22" rx="3" fill="none" stroke="#4FA3E3" stroke-width="2.5"/>
      <text x="52" y="33" font-weight="600">PPT · Excel</text>
    </g>
    <g transform="translate(70,504)">
      <rect x="0" y="0" width="230" height="52" rx="10" fill="#0F2842" stroke="#22456B" stroke-width="1.5"/>
      <path d="M18 14 h16 l6 6 v18 h-22 z" fill="none" stroke="#4FA3E3" stroke-width="2.5"/>
      <text x="52" y="33" font-weight="600">Docs · dictionaries</text>
    </g>
    <g fill="#3A5D80"><circle cx="185" cy="582" r="3.5"/><circle cx="185" cy="596" r="3.5"/><circle cx="185" cy="610" r="3.5"/></g>
