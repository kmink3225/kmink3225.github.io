      <text x="62" y="52" font-size="14" fill="#9FC4E6">Self-RAG / CRAG · cited</text>
      <text x="20" y="90" font-size="12" letter-spacing="2" fill="#38D6C8" font-weight="700">RAG · STREAMING</text>
