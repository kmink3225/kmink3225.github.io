    <polygon points="700,388 762,424 762,496 700,532 638,496 638,424" fill="url(#hub)" stroke="#4FA3E3" stroke-width="2"/>
    <polygon points="700,404 748,432 748,488 700,516 652,488 652,432" fill="none" stroke="#8FD4F5" stroke-width="1.2" opacity="0.6"/>
