    <rect x="0" y="0" width="500" height="118" rx="14" fill="#0C3330" stroke="#2E8C84" stroke-width="1.8"/>
    <text x="24" y="34" font-size="15" letter-spacing="2" fill="#38D6C8" font-weight="700">BENCHMARK · 9 VARIANTS COMPARED</text>
    <text x="24" y="70" font-size="21" font-weight="800" fill="#FFFFFF">Self-built harness beats all larger models</text>
    <text x="24" y="98" font-size="15" fill="#A9E4DC">GPT-5.4-mini · composite 0.977 · 11.6s · $0.076 — ~17× cheaper</text>
  </g>

