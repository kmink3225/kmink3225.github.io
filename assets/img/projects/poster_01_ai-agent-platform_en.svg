    <text x="385" y="950">Azure OpenAI</text>
    <text x="575" y="950">Azure AI Search</text>
    <text x="790" y="950">FastAPI</text>
    <text x="915" y="950">React</text>
    <text x="1010" y="950">Cosmos DB</text>
    <text x="1170" y="950">ALBERT</text>
    <text x="1300" y="950">LLM-as-Judge</text>
