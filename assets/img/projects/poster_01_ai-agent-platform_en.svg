      <rect x="0" y="0" width="5" height="86" rx="2.5" fill="#B39DE8"/>
      <text x="24" y="34" font-size="19" font-weight="800" fill="#FFFFFF">2-Layer code RAG</text>
      <text x="24" y="62" font-size="15" fill="#9FC4E6">Graph→Agentic RAG over 40K AST facts + code graph</text>
    </g>
  </g>

