      <text x="72" y="52" font-size="14" fill="#C6B8EC">AST + graph grounding</text>
      <text x="20" y="90" font-size="12" letter-spacing="2" fill="#B39DE8" font-weight="700">2-LAYER RAG</text>
    </g>
