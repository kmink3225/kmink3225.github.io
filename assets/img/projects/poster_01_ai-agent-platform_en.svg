  <g fill="#38D6C8"><circle cx="58" cy="945" r="3"/><circle cx="218" cy="945" r="3"/><circle cx="373" cy="945" r="3"/><circle cx="563" cy="945" r="3"/><circle cx="778" cy="945" r="3"/><circle cx="903" cy="945" r="3"/><circle cx="998" cy="945" r="3"/><circle cx="1158" cy="945" r="3"/><circle cx="1288" cy="945" r="3"/></g>
</svg>
