<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9FDFC"/><stop offset="1" stop-color="#E9F4F1"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="12" fill="#2A9D8F"/>

  <text x="70" y="80" font-size="19" letter-spacing="5" fill="#1E7A6E" font-weight="700">03 · SIGNAL PROCESSING · BASELINE CORRECTION</text>
  <text x="68" y="140" font-size="56" font-weight="800" fill="#123A34">PCR Signal Baseline Correction</text>
  <text x="70" y="180" font-size="23" fill="#4C6E67">Redesigning a hard-coded legacy baseline into a data-driven mixed-basis-function model.</text>
  <text x="70" y="212" font-size="16" fill="#7C978F">Seegene Diagnostics IT / Data Science · Technical Lead &amp; Data Scientist · DS 3 · DE 1 · 2024.01–2024.09</text>
  <line x1="70" y1="236" x2="1530" y2="236" stroke="#D5E7E2" stroke-width="1.5"/>

  <!-- LEFT: challenge -->
  <text x="70" y="292" font-size="17" letter-spacing="2" fill="#2A9D8F" font-weight="700">CHALLENGE</text>
  <g>
    <g transform="translate(70,308)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#2A9D8F"/><text x="22" y="32" font-size="17" font-weight="700" fill="#123A34">Noise complexity</text><text x="22" y="56" font-size="13.5" fill="#5C7C75">Chemical/optical/mechanical mix</text></g>
    <g transform="translate(70,392)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#38B2A0"/><text x="22" y="32" font-size="17" font-weight="700" fill="#123A34">Fragmented algorithms</text><text x="22" y="56" font-size="13.5" fill="#5C7C75">Inconsistent across products</text></g>
    <g transform="translate(70,476)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#48C78E"/><text x="22" y="32" font-size="17" font-weight="700" fill="#123A34">Gray-zone signals</text><text x="22" y="56" font-size="13.5" fill="#5C7C75">Where false pos/neg concentrate</text></g>
    <g transform="translate(70,560)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#7CC7A8"/><text x="22" y="32" font-size="17" font-weight="700" fill="#123A34">C++ minimal packages</text><text x="22" y="56" font-size="13.5" fill="#5C7C75">No external ML frameworks</text></g>
  </g>

  <!-- CENTER: charts -->
  <text x="410" y="292" font-size="17" letter-spacing="2" fill="#2A9D8F" font-weight="700">CHARACTERISTIC-EQUATION MODEL</text>
  <g transform="translate(410,304)">
    <rect x="0" y="0" width="450" height="176" rx="14" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.8"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#123A34">Raw signal + baseline drift</text>
    <line x1="36" y1="150" x2="430" y2="150" stroke="#C2D9D3" stroke-width="1.8"/>
    <line x1="36" y1="52" x2="36" y2="150" stroke="#C2D9D3" stroke-width="1.8"/>
    <path d="M36 135 Q160 145 260 128 T430 112" fill="none" stroke="#E8912D" stroke-width="2.5" stroke-dasharray="7 5"/>
    <path d="M36 132 Q180 134 260 118 Q320 96 350 62 Q375 50 430 48" fill="none" stroke="#2A9D8F" stroke-width="3.5"/>
    <text x="330" y="86" font-size="13" fill="#1E7A6E" font-weight="700">Amp curve</text>
    <text x="130" y="142" font-size="12" fill="#C97A12" font-weight="700">baseline</text>
  </g>
  <g stroke="#2A9D8F" stroke-width="3" fill="#2A9D8F"><line x1="635" y1="484" x2="635" y2="506"/><polygon points="628,503 635,516 642,503"/></g>
  <text x="660" y="502" font-size="14" font-weight="700" fill="#1E7A6E">correct</text>
  <g transform="translate(410,520)">
    <rect x="0" y="0" width="450" height="152" rx="14" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.8"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#123A34">Residual after subtraction</text>
    <line x1="36" y1="86" x2="430" y2="86" stroke="#C2D9D3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M36 86 L66 79 L92 93 L118 77 L148 95 L178 80 L210 91 L246 77 L278 93 L308 80 L340 92 L372 78 L404 93 L430 86" fill="none" stroke="#388E3C" stroke-width="2.5"/>
    <rect x="120" y="110" width="260" height="30" rx="15" fill="#E7F4E8"/><text x="250" y="131" font-size="15" font-weight="800" fill="#2E7D32" text-anchor="middle">#1 closest to white noise (of 5)</text>
  </g>

  <!-- RIGHT -->
  <text x="1030" y="292" font-size="18" letter-spacing="2" fill="#2A9D8F" font-weight="700">KEY APPROACH</text>
  <g>
    <g transform="translate(1030,304)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#2A9D8F"/><text x="24" y="34" font-size="19" font-weight="800" fill="#123A34">Data pipeline</text><text x="24" y="60" font-size="15" fill="#4C6E67">Automated collection/preprocessing replaces manual selection</text></g>
    <g transform="translate(1030,398)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#38B2A0"/><text x="24" y="34" font-size="19" font-weight="800" fill="#123A34">Mixed-basis characteristic equation</text><text x="24" y="60" font-size="15" fill="#4C6E67">Poly/exp/log transforms + light linear regression</text></g>
    <g transform="translate(1030,492)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#D5E7E2" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#48C78E"/><text x="24" y="34" font-size="19" font-weight="800" fill="#123A34">6-algorithm comparison</text><text x="24" y="60" font-size="15" fill="#4C6E67">Raw · 3rd-party black box · 2 legacy · rule · this ML</text></g>
  </g>
  <g transform="translate(1030,594)"><rect width="500" height="78" rx="14" fill="#E7F4EF" stroke="#38B2A0" stroke-width="1.8"/><text x="24" y="32" font-size="14" letter-spacing="2" fill="#1E7A6E" font-weight="700">EXTERNAL VALIDATION</text><text x="24" y="60" font-size="16" fill="#123A34" font-weight="600">Head-to-head vs. industry-leading black box</text></g>

  <!-- METRICS -->
  <rect x="70" y="720" width="1460" height="116" rx="16" fill="#EAF5F1" stroke="#D5E7E2" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="313" y="778" font-size="38" font-weight="800" fill="#1E7A6E">91.49% ↓</text><text x="313" y="810" font-size="15" fill="#4C6E67">False-negative 0.47% → 0.04%</text>
    <line x1="557" y1="748" x2="557" y2="808" stroke="#CFE4DE" stroke-width="1.5"/>
    <text x="800" y="778" font-size="38" font-weight="800" fill="#2A9D8F">#1</text><text x="800" y="810" font-size="15" fill="#4C6E67">White-noise approximation (of 5)</text>
    <line x1="1043" y1="748" x2="1043" y2="808" stroke="#CFE4DE" stroke-width="1.5"/>
    <text x="1287" y="778" font-size="34" font-weight="800" fill="#48A878">Rule → ML</text><text x="1287" y="810" font-size="15" fill="#4C6E67">Data-driven shift</text>
  </g>

  <!-- TECH -->
  <text x="70" y="888" font-size="15" letter-spacing="3" fill="#7C978F" font-weight="700">TECH STACK</text>
  <g font-size="17" fill="#3C5C55" font-weight="600">
    <text x="70" y="928">Python</text><text x="180" y="928">Matlab</text><text x="295" y="928">NumPy</text><text x="405" y="928">Pandas</text><text x="525" y="928">Matplotlib</text><text x="675" y="928">Plotly</text><text x="775" y="928">Mixed basis fns</text><text x="945" y="928">Momentum GD</text><text x="1150" y="928">Custom NN</text>
  </g>
  <g fill="#2A9D8F"><circle cx="58" cy="923" r="3"/><circle cx="168" cy="923" r="3"/><circle cx="283" cy="923" r="3"/><circle cx="393" cy="923" r="3"/><circle cx="513" cy="923" r="3"/><circle cx="663" cy="923" r="3"/><circle cx="763" cy="923" r="3"/><circle cx="933" cy="923" r="3"/><circle cx="1138" cy="923" r="3"/></g>
</svg>
