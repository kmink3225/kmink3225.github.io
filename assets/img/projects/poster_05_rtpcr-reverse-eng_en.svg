    <text x="617" y="778" font-size="36" font-weight="800" fill="#A9761F">10+</text><text x="617" y="810" font-size="15" fill="#6E5E3E">Correction stages</text>
    <line x1="800" y1="748" x2="800" y2="808" stroke="#E0D6C0" stroke-width="1.5"/>
    <text x="982" y="778" font-size="36" font-weight="800" fill="#C8912E">50+</text><text x="982" y="810" font-size="15" fill="#6E5E3E">Empirical parameters</text>
    <line x1="1165" y1="748" x2="1165" y2="808" stroke="#E0D6C0" stroke-width="1.5"/>
    <text x="1347" y="778" font-size="32" font-weight="800" fill="#2E6BA6">Joint Est.</text><text x="1347" y="810" font-size="15" fill="#6E5E3E">Sequential → joint</text>
  </g>

