  <g stroke="#A9761F" stroke-width="3" fill="#A9761F"><line x1="635" y1="458" x2="635" y2="480"/><polygon points="628,477 635,490 642,477"/></g>
  <text x="660" y="476" font-size="14" font-weight="700" fill="#8A5E1E">80% reverse-engineered</text>
  <g transform="translate(410,494)">
    <rect x="0" y="0" width="450" height="178" rx="14" fill="#ffffff" stroke="#E4DCCB" stroke-width="1.8"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#2E2A22">Hybrid statistical model · Joint estimation</text>
    <line x1="36" y1="128" x2="410" y2="128" stroke="#D8CFBB" stroke-width="1.8"/>
    <line x1="36" y1="52" x2="36" y2="128" stroke="#D8CFBB" stroke-width="1.8"/>
    <path d="M36 120 Q150 118 210 96 Q262 74 290 52 Q305 46 410 44" fill="none" stroke="#2E6BA6" stroke-width="3"/>
    <circle cx="150" cy="116" r="5" fill="#48A878"/><circle cx="252" cy="74" r="5" fill="#C8912E"/><circle cx="380" cy="45" r="5" fill="#2E6BA6"/>
    <text x="150" y="150" font-size="13" fill="#2E2A22" text-anchor="middle">f(x)=g3(g2(g1(x)))+sigmoid(x,β)</text>
    <text x="345" y="150" font-size="13" fill="#6E5E3E" text-anchor="middle">joint optimization</text>
  </g>

  <!-- RIGHT -->
  <text x="1030" y="292" font-size="18" letter-spacing="2" fill="#8A5E1E" font-weight="700">APPROACH</text>
  <g>
    <g transform="translate(1030,304)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#E4DCCB" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#A9761F"/><text x="24" y="34" font-size="19" font-weight="800" fill="#2E2A22">Legacy reverse-engineering + port</text><text x="24" y="60" font-size="15" fill="#6E5E3E">50+ parameter dependency analysis · C++ port spec</text></g>
    <g transform="translate(1030,398)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#E4DCCB" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#C8912E"/><text x="24" y="34" font-size="19" font-weight="800" fill="#2E2A22">Mechanistic + statistical hybrid</text><text x="24" y="60" font-size="15" fill="#6E5E3E">RT-PCR kinetics sigmoid + composite function</text></g>
    <g transform="translate(1030,492)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#E4DCCB" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#D9A94A"/><text x="24" y="34" font-size="19" font-weight="800" fill="#2E2A22">Joint estimation</text><text x="24" y="60" font-size="15" fill="#6E5E3E">Sequential bias → structurally removed, analytic gradient</text></g>
  </g>
  <g transform="translate(1030,594)"><rect width="500" height="78" rx="14" fill="#F5EEDD" stroke="#C8912E" stroke-width="1.8"/><text x="24" y="32" font-size="14" letter-spacing="2" fill="#8A5E1E" font-weight="700">LESSON LEARNED</text><text x="24" y="60" font-size="16" fill="#5A4A20" font-weight="600">Technical excellence ≠ adoption — buy-in matters</text></g>

  <!-- METRICS -->
  <rect x="70" y="720" width="1460" height="116" rx="16" fill="#F4F0E7" stroke="#E4DCCB" stroke-width="1.5"/>
  <g text-anchor="middle">
