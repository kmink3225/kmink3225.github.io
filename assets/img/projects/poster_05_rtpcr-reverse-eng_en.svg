    <text x="70" y="928">Python</text><text x="185" y="928">Matlab</text><text x="300" y="928">NumPy</text><text x="410" y="928">pandas</text><text x="525" y="928">Mechanistic Modeling</text><text x="775" y="928">Joint Estimation</text><text x="960" y="928">Residual Analysis</text><text x="1155" y="928">White-noise Testing</text>
  </g>
