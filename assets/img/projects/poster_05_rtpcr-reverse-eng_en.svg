<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDFCF9"/><stop offset="1" stop-color="#F2EEE5"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="12" fill="#A9761F"/>

  <text x="70" y="80" font-size="19" letter-spacing="5" fill="#8A5E1E" font-weight="700">05 · REVERSE ENGINEERING · STATISTICAL MODELING</text>
  <text x="68" y="140" font-size="48" font-weight="800" fill="#2E2A22">RT-PCR Reverse Engineering &amp; Statistical Redesign</text>
  <text x="70" y="180" font-size="23" fill="#7A6A48">Interpreting an undocumented legacy and reformulating it as a joint-estimation hybrid.</text>
  <text x="70" y="212" font-size="16" fill="#9A8A68">Seegene Diagnostics IT / Data Science · Data Scientist (analysis &amp; redesign) · DS team of 6 · 2021.10–2023.04</text>
  <line x1="70" y1="236" x2="1530" y2="236" stroke="#E4DCCB" stroke-width="1.5"/>

  <!-- LEFT -->
  <text x="70" y="292" font-size="17" letter-spacing="2" fill="#8A5E1E" font-weight="700">PROBLEM</text>
  <g>
    <g transform="translate(70,308)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#E4DCCB" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#A9761F"/><text x="22" y="32" font-size="16" font-weight="700" fill="#2E2A22">No docs / comments</text><text x="22" y="56" font-size="13.5" fill="#6E5E3E">Low-readability names</text></g>
    <g transform="translate(70,392)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#E4DCCB" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#C8912E"/><text x="22" y="32" font-size="16" font-weight="700" fill="#2E2A22">Hundreds of paths</text><text x="22" y="56" font-size="13.5" fill="#6E5E3E">10+ stages × 5+ conditions</text></g>
    <g transform="translate(70,476)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#E4DCCB" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#D9A94A"/><text x="22" y="32" font-size="16" font-weight="700" fill="#2E2A22">Systematic bias</text><text x="22" y="56" font-size="13.5" fill="#6E5E3E">Non-linear interactions</text></g>
    <g transform="translate(70,560)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#E4DCCB" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#E0BE72"/><text x="22" y="32" font-size="16" font-weight="700" fill="#2E2A22">Explainability required</text><text x="22" y="56" font-size="13.5" fill="#6E5E3E">For regulatory clearance</text></g>
  </g>

