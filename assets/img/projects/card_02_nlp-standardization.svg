  <text x="70" y="510" font-size="46" font-weight="800" fill="#3A1D4A">자연어처리 기반 데이터 표준화 시스템</text>
  <text x="70" y="550" font-size="22" fill="#8A7897">16개 부서 · 53개 DB · Rule + ALBERT/KLUE-RoBERTa + RAG · 2024.06–2025.09</text>

  <g font-weight="800" text-anchor="middle">
    <rect x="70" y="586" width="176" height="66" rx="10" fill="#3A1D4A"/>
    <text x="158" y="622" font-size="26" fill="#ffffff">99% 단축</text>
    <text x="158" y="642" font-size="12" fill="#C7A9D6" font-weight="500">검증시간 8h→0.73s</text>
    <rect x="258" y="586" width="176" height="66" rx="10" fill="#7B1FA2"/>
    <text x="346" y="622" font-size="26" fill="#ffffff">96.88%</text>
    <text x="346" y="642" font-size="12" fill="#E3CCEE" font-weight="500">도메인 분류 정확도</text>
    <rect x="446" y="586" width="176" height="66" rx="10" fill="#8E44AD"/>
    <text x="534" y="622" font-size="26" fill="#ffffff">94.3%↓</text>
    <text x="534" y="642" font-size="12" fill="#E3CCEE" font-weight="500">부서간 문의 감소</text>
  </g>
