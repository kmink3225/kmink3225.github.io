      <text x="160" y="77">customer_name</text>
      <line x1="20" y1="108" x2="140" y2="108" stroke="#B98FCE" stroke-width="10" stroke-linecap="round"/>
      <text x="160" y="113">order_date</text>
      <line x1="20" y1="144" x2="140" y2="144" stroke="#B98FCE" stroke-width="10" stroke-linecap="round"/>
      <text x="160" y="149">product_code</text>
      <line x1="20" y1="180" x2="140" y2="180" stroke="#B98FCE" stroke-width="10" stroke-linecap="round"/>
      <text x="160" y="185">device_status</text>
    </g>
