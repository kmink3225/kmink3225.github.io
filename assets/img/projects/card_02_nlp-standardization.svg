  <g stroke="#B98FCE" stroke-width="2.5" fill="none">
    <path d="M400 305 L470 305" marker-end="url(#ah2)"/>
    <path d="M650 305 L730 305" marker-end="url(#ah2)"/>
  </g>
  <defs><marker id="ah2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8E44AD"/></marker></defs>

  <!-- standardized dictionary right -->
  <g transform="translate(740,205)">
    <rect x="0" y="0" width="300" height="200" rx="14" fill="#ffffff" stroke="#8E44AD" stroke-width="3"/>
    <rect x="0" y="0" width="300" height="42" rx="14" fill="#F3E9F8"/>
    <rect x="0" y="28" width="300" height="14" fill="#F3E9F8"/>
    <text x="20" y="28" font-size="16" font-weight="800" fill="#5B2A72">표준 사전</text>
    <text x="280" y="28" font-size="13" font-weight="700" fill="#8E44AD" text-anchor="end">98.7% 일관성</text>
