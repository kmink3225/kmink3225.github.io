<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFBFE"/>
      <stop offset="1" stop-color="#F0EAF6"/>
    </linearGradient>
    <linearGradient id="proc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E44AD"/>
      <stop offset="1" stop-color="#5B2A72"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>
  <rect x="0" y="0" width="10" height="720" fill="#7B1FA2"/>
  <text x="70" y="86" font-size="24" letter-spacing="3" fill="#7B1FA2" font-weight="700">02 · NLP / DATA STANDARDIZATION</text>
  <line x1="70" y1="104" x2="330" y2="104" stroke="#7B1FA2" stroke-width="3"/>

  <!-- messy tokens left -->
  <text x="70" y="176" font-size="16" fill="#9A7BB0" font-weight="600">불일치 메타데이터 83%</text>
  <g font-size="17" font-weight="600" fill="#6B5B78">
    <g transform="translate(95,205) rotate(-8)"><rect width="118" height="40" rx="20" fill="#ffffff" stroke="#C7A9D6" stroke-width="2.5"/><text x="59" y="26" text-anchor="middle">cust_nm</text></g>
    <g transform="translate(235,235) rotate(6)"><rect width="132" height="40" rx="20" fill="#ffffff" stroke="#C7A9D6" stroke-width="2.5"/><text x="66" y="26" text-anchor="middle">고객명칭</text></g>
    <g transform="translate(80,300) rotate(4)"><rect width="150" height="40" rx="20" fill="#ffffff" stroke="#C7A9D6" stroke-width="2.5"/><text x="75" y="26" text-anchor="middle">CustomerNM</text></g>
    <g transform="translate(255,320) rotate(-7)"><rect width="120" height="40" rx="20" fill="#ffffff" stroke="#C7A9D6" stroke-width="2.5"/><text x="60" y="26" text-anchor="middle">c_name</text></g>
    <g transform="translate(120,392) rotate(9)"><rect width="150" height="40" rx="20" fill="#ffffff" stroke="#C7A9D6" stroke-width="2.5"/><text x="75" y="26" text-anchor="middle">고객_이름</text></g>
  </g>

  <!-- processor -->
  <g>
    <rect x="470" y="200" width="180" height="210" rx="16" fill="url(#proc2)"/>
    <text x="560" y="240" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">Hybrid Engine</text>
    <line x1="500" y1="256" x2="620" y2="256" stroke="#B98FCE" stroke-width="1.5"/>
    <text x="560" y="290" font-size="16" fill="#EAD9F2" text-anchor="middle">Rule 약어사전</text>
    <text x="560" y="322" font-size="16" fill="#EAD9F2" text-anchor="middle">도메인 분류기(ML)</text>
    <text x="560" y="354" font-size="16" fill="#EAD9F2" text-anchor="middle">RAG 추천</text>
    <text x="560" y="388" font-size="13" fill="#C7A9D6" text-anchor="middle">KLUE-RoBERTa · ko-sroberta</text>
