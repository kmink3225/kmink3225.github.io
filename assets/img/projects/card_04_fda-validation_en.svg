<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#E7EDF5"/>
    </linearGradient>
    <linearGradient id="shield4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6BA6"/>
      <stop offset="1" stop-color="#16324F"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg4)"/>
  <rect x="0" y="0" width="10" height="720" fill="#16324F"/>
  <text x="70" y="86" font-size="24" letter-spacing="3" fill="#16324F" font-weight="700">04 · FDA STATISTICAL VALIDATION</text>
  <line x1="70" y1="104" x2="380" y2="104" stroke="#16324F" stroke-width="3"/>

  <!-- distributions card -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="470" height="300" rx="14" fill="#ffffff" stroke="#D4DEEA" stroke-width="2"/>
    <text x="20" y="34" font-size="17" font-weight="700" fill="#16324F">Statistical Testing</text>
    <text x="20" y="56" font-size="13" fill="#7C8B99">χ² · Repeated-measures ANOVA · McNemar</text>
    <line x1="40" y1="250" x2="440" y2="250" stroke="#B7C6D6" stroke-width="2"/>
    <path d="M40 250 C120 250 130 110 200 110 C270 110 280 250 360 250" fill="#DCE8F4" stroke="#2E6BA6" stroke-width="3"/>
    <path d="M150 250 C230 250 240 140 310 140 C380 140 390 250 460 250" fill="#E6F3F1" stroke="#3FA7A0" stroke-width="3" opacity="0.85" transform="translate(-30,0)"/>
    <line x1="200" y1="110" x2="200" y2="250" stroke="#2E6BA6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="245" y="95" font-size="14" font-weight="800" fill="#16324F">p &lt; 0.05</text>
  </g>

  <!-- switch model -->
  <g transform="translate(575,150)">
    <rect x="0" y="0" width="300" height="300" rx="14" fill="#ffffff" stroke="#D4DEEA" stroke-width="2"/>
    <text x="20" y="34" font-size="17" font-weight="700" fill="#16324F">Switch Model</text>
    <text x="20" y="56" font-size="13" fill="#7C8B99">modules on/off · 10 scenarios</text>
    <g font-size="14" fill="#3A4A5A">
      <!-- toggles -->
      <g transform="translate(20,80)">
        <text x="0" y="18" font-weight="600">Module 1</text>
        <rect x="200" y="2" width="56" height="26" rx="13" fill="#2E6BA6"/><circle cx="243" cy="15" r="10" fill="#fff"/>
      </g>
      <g transform="translate(20,120)">
        <text x="0" y="18" font-weight="600">Module 2</text>
        <rect x="200" y="2" width="56" height="26" rx="13" fill="#C7D3E0"/><circle cx="213" cy="15" r="10" fill="#fff"/>
      </g>
      <g transform="translate(20,160)">
        <text x="0" y="18" font-weight="600">Module 3</text>
        <rect x="200" y="2" width="56" height="26" rx="13" fill="#2E6BA6"/><circle cx="243" cy="15" r="10" fill="#fff"/>
      </g>
      <g transform="translate(20,200)">
        <text x="0" y="18" font-weight="600">Module …</text>
        <rect x="200" y="2" width="56" height="26" rx="13" fill="#C7D3E0"/><circle cx="213" cy="15" r="10" fill="#fff"/>
      </g>
      <g transform="translate(20,240)">
        <text x="0" y="18" font-weight="600">Module 8</text>
        <rect x="200" y="2" width="56" height="26" rx="13" fill="#2E6BA6"/><circle cx="243" cy="15" r="10" fill="#fff"/>
      </g>
    </g>
  </g>

  <!-- FDA shield -->
  <g transform="translate(945,175)">
    <path d="M120 0 L235 40 C235 160 185 235 120 260 C55 235 5 160 5 40 Z" fill="url(#shield4)"/>
    <path d="M75 130 L108 165 L175 88" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="215" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">FDA</text>
    <text x="120" y="240" font-size="13" fill="#B9D2E8" text-anchor="middle">Validation</text>
  </g>

  <text x="70" y="530" font-size="43" font-weight="800" fill="#16324F">FDA Software-Validation Statistical Analysis</text>
  <text x="70" y="570" font-size="22" fill="#7C8B99">EN62304 · two-track validation · Quarto auto-report · 2023.05–2023.12</text>

  <g font-weight="800" text-anchor="middle">
    <rect x="70" y="606" width="176" height="66" rx="10" fill="#16324F"/>
    <text x="158" y="642" font-size="25" fill="#ffffff">87.5% ↓</text>
    <text x="158" y="662" font-size="12" fill="#9CB6CE" font-weight="500">6 mo → 3 wk</text>
    <rect x="258" y="606" width="150" height="66" rx="10" fill="#2E6BA6"/>
    <text x="333" y="642" font-size="25" fill="#ffffff">99.2%</text>
    <text x="333" y="662" font-size="12" fill="#CFE0EF" font-weight="500">Safety confidence</text>
    <rect x="420" y="606" width="150" height="66" rx="10" fill="#3FA7A0"/>
    <text x="495" y="642" font-size="25" fill="#ffffff">200p</text>
    <text x="495" y="662" font-size="12" fill="#DAF1EE" font-weight="500">V&amp;V semi-auto</text>
  </g>
</svg>
