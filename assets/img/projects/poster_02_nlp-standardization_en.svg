<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#F0F3F8"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B51C4"/><stop offset="1" stop-color="#6A1B9A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="12" fill="#7B1FA2"/>

  <!-- HEADER -->
  <text x="70" y="80" font-size="19" letter-spacing="5" fill="#7B1FA2" font-weight="700">02 · NLP · DATA STANDARDIZATION SYSTEM</text>
  <text x="68" y="140" font-size="54" font-weight="800" fill="#2A1240">NLP-Based Data Standardization System</text>
  <text x="70" y="180" font-size="23" fill="#7A6690">A Rule + Classifier + RAG hybrid that auto-maps metadata to standard terms.</text>
  <text x="70" y="212" font-size="16" fill="#9A8AB0">Seegene SW Institute, Core Dev Team · Technical Lead (Data Architect → DS/AI) · cross-team ~15 · 2024.06–2025.09</text>
  <line x1="70" y1="236" x2="1530" y2="236" stroke="#E4DCEE" stroke-width="1.5"/>

  <!-- LEFT: input -->
  <text x="70" y="292" font-size="17" letter-spacing="2" fill="#9A7BB0" font-weight="700">INPUT · 83% MISMATCH</text>
  <g font-size="17" font-weight="600" fill="#5A4A68">
    <g transform="translate(78,312) rotate(-5)"><rect width="150" height="42" rx="21" fill="#ffffff" stroke="#D6BEE6" stroke-width="2"/><text x="75" y="27" text-anchor="middle">cust_nm</text></g>
    <g transform="translate(120,372) rotate(4)"><rect width="170" height="42" rx="21" fill="#ffffff" stroke="#D6BEE6" stroke-width="2"/><text x="85" y="27" text-anchor="middle">CustomerNM</text></g>
    <g transform="translate(70,432) rotate(3)"><rect width="160" height="42" rx="21" fill="#ffffff" stroke="#D6BEE6" stroke-width="2"/><text x="80" y="27" text-anchor="middle">Customer Name</text></g>
    <g transform="translate(130,492) rotate(-4)"><rect width="150" height="42" rx="21" fill="#ffffff" stroke="#D6BEE6" stroke-width="2"/><text x="75" y="27" text-anchor="middle">cust_name</text></g>
    <g transform="translate(80,552) rotate(2)"><rect width="130" height="42" rx="21" fill="#ffffff" stroke="#D6BEE6" stroke-width="2"/><text x="65" y="27" text-anchor="middle">c_name</text></g>
  </g>
  <text x="70" y="642" font-size="15" fill="#9A8AB0">16 depts · 53 DBs · Data Silo</text>
  <g stroke="#7B1FA2" stroke-width="2.5" fill="none" opacity="0.7"><path d="M300 440 C360 440 360 430 405 430" stroke-dasharray="2 8" stroke-linecap="round"/></g>

  <!-- CENTER: hybrid engine pipeline -->
  <text x="430" y="288" font-size="18" letter-spacing="2" fill="#7B1FA2" font-weight="700">HYBRID ENGINE</text>
  <g>
    <g transform="translate(410,300)">
      <rect x="0" y="0" width="420" height="76" rx="14" fill="#ffffff" stroke="#E4DCEE" stroke-width="1.8"/>
      <rect x="0" y="0" width="6" height="76" rx="3" fill="#7B1FA2"/>
      <text x="26" y="34" font-size="20" font-weight="800" fill="#2A1240">Step 1 · Rule preprocessing</text>
      <text x="26" y="60" font-size="15" fill="#7A6690">Dictionary match · regex · priority rules</text>
    </g>
    <g transform="translate(410,398)">
      <rect x="0" y="0" width="420" height="76" rx="14" fill="#ffffff" stroke="#E4DCEE" stroke-width="1.8"/>
      <rect x="0" y="0" width="6" height="76" rx="3" fill="#9B51C4"/>
      <text x="26" y="34" font-size="20" font-weight="800" fill="#2A1240">Step 2 · ML domain classifier</text>
      <text x="26" y="60" font-size="15" fill="#7A6690">KLUE-RoBERTa / KoBERT · 8-model benchmark</text>
    </g>
    <g transform="translate(410,496)">
      <rect x="0" y="0" width="420" height="76" rx="14" fill="#ffffff" stroke="#E4DCEE" stroke-width="1.8"/>
      <rect x="0" y="0" width="6" height="76" rx="3" fill="#B57BE0"/>
      <text x="26" y="34" font-size="20" font-weight="800" fill="#2A1240">Step 3 · RAG semantic search</text>
      <text x="26" y="60" font-size="15" fill="#7A6690">Rule-based term suggestion · synonym clustering</text>
    </g>
    <g stroke="#C79BDE" stroke-width="2.5" fill="#C79BDE">
      <line x1="620" y1="376" x2="620" y2="396"/><polygon points="614,393 620,404 626,393"/>
      <line x1="620" y1="474" x2="620" y2="494"/><polygon points="614,491 620,502 626,491"/>
    </g>
    <!-- output -->
    <g transform="translate(410,594)">
      <rect x="0" y="0" width="420" height="78" rx="14" fill="#F5ECFA" stroke="#B57BE0" stroke-width="2"/>
      <text x="26" y="34" font-size="20" font-weight="800" fill="#6A1B9A">Standardized metadata</text>
      <text x="26" y="60" font-size="15" fill="#7A5A90">Standard term · definition · confidence · method (Rule/ML/RAG)</text>
      <path d="M355 30 l10 10 l18 -20" fill="none" stroke="#7B1FA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g stroke="#C79BDE" stroke-width="2.5" fill="#C79BDE"><line x1="620" y1="572" x2="620" y2="592"/><polygon points="614,589 620,600 626,589"/></g>
  </g>

  <!-- RIGHT: key + highlight -->
  <text x="1030" y="288" font-size="18" letter-spacing="2" fill="#7B1FA2" font-weight="700">KEY COMPONENTS</text>
  <g>
    <g transform="translate(1030,300)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#E4DCEE" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#7B1FA2"/><text x="24" y="34" font-size="19" font-weight="800" fill="#2A1240">Standardization framework</text><text x="24" y="60" font-size="15" fill="#7A6690">14 naming rules + word/domain/term dictionaries (582 words)</text></g>
    <g transform="translate(1030,394)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#E4DCEE" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#9B51C4"/><text x="24" y="34" font-size="19" font-weight="800" fill="#2A1240">Intelligent automation</text><text x="24" y="60" font-size="15" fill="#7A6690">8-model classification · ko-sroberta+HDBSCAN · RAG suggestion</text></g>
    <g transform="translate(1030,488)"><rect width="500" height="82" rx="12" fill="#ffffff" stroke="#E4DCEE" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#B57BE0"/><text x="24" y="34" font-size="19" font-weight="800" fill="#2A1240">Reproducible ML engineering</text><text x="24" y="60" font-size="15" fill="#7A6690">pytest 60 + GitHub Actions CI + Docker</text></g>
  </g>
  <g transform="translate(1030,590)">
    <rect width="500" height="82" rx="14" fill="#F0EAF7" stroke="#9B51C4" stroke-width="1.8"/>
    <text x="24" y="32" font-size="14" letter-spacing="2" fill="#7B1FA2" font-weight="700">BENCHMARK · 8-MODEL DOMAIN CLASSIFICATION</text>
    <text x="24" y="60" font-size="15" fill="#4A2E5E" font-weight="600">KLUE-RoBERTa 96.88% (1st) · 671K BiLSTM on par with 110M-class</text>
  </g>

  <!-- METRICS -->
  <rect x="70" y="720" width="1460" height="116" rx="16" fill="#F4EFFA" stroke="#E4DCEE" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="252" y="778" font-size="38" font-weight="800" fill="#6A1B9A">99% ↓</text><text x="252" y="810" font-size="15" fill="#7A6690">Validation 8h → 0.73s</text>
    <line x1="435" y1="748" x2="435" y2="808" stroke="#E0D4EE" stroke-width="1.5"/>
    <text x="617" y="778" font-size="38" font-weight="800" fill="#7B1FA2">94.3% ↓</text><text x="617" y="810" font-size="15" fill="#7A6690">Cross-team inquiries</text>
    <line x1="800" y1="748" x2="800" y2="808" stroke="#E0D4EE" stroke-width="1.5"/>
    <text x="982" y="778" font-size="38" font-weight="800" fill="#9B51C4">98.7%</text><text x="982" y="810" font-size="15" fill="#7A6690">Metadata consistency</text>
    <line x1="1165" y1="748" x2="1165" y2="808" stroke="#E0D4EE" stroke-width="1.5"/>
    <text x="1347" y="778" font-size="38" font-weight="800" fill="#B57BE0">96.88%</text><text x="1347" y="810" font-size="15" fill="#7A6690">Domain classification accuracy</text>
  </g>

  <!-- TECH -->
  <text x="70" y="888" font-size="15" letter-spacing="3" fill="#9A8AB0" font-weight="700">TECH STACK</text>
  <g font-size="17" fill="#5A4A68" font-weight="600">
    <text x="70" y="928">KLUE-RoBERTa</text><text x="270" y="928">KoBERT</text><text x="390" y="928">ALBERT</text><text x="510" y="928">ko-sroberta</text><text x="675" y="928">HDBSCAN</text><text x="820" y="928">LangChain</text><text x="975" y="928">Streamlit</text><text x="1115" y="928">Docker</text><text x="1230" y="928">GitHub Actions</text>
  </g>
  <g fill="#7B1FA2"><circle cx="58" cy="923" r="3"/><circle cx="258" cy="923" r="3"/><circle cx="378" cy="923" r="3"/><circle cx="498" cy="923" r="3"/><circle cx="663" cy="923" r="3"/><circle cx="808" cy="923" r="3"/><circle cx="963" cy="923" r="3"/><circle cx="1103" cy="923" r="3"/><circle cx="1218" cy="923" r="3"/></g>
</svg>
