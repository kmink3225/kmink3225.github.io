<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#EDF1F7"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E6BA6"/><stop offset="1" stop-color="#16324F"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="12" fill="#16324F"/>

  <text x="70" y="80" font-size="19" letter-spacing="5" fill="#B0851F" font-weight="700">04 · FDA · STATISTICAL SAFETY VALIDATION</text>
  <text x="68" y="140" font-size="50" font-weight="800" fill="#16324F">FDA Software-Validation Statistical Analysis</text>
  <text x="70" y="180" font-size="23" fill="#5A7085">A validation pipeline that proves algorithm safety statistically.</text>
  <text x="70" y="212" font-size="16" fill="#8A9AA8">Seegene Diagnostics IT / Data Science · Technical Lead &amp; Data Scientist · cross-functional 16 · 2023.05–2023.12</text>
  <line x1="70" y1="236" x2="1530" y2="236" stroke="#DCE4EC" stroke-width="1.5"/>

  <!-- LEFT -->
  <text x="70" y="292" font-size="17" letter-spacing="2" fill="#B0851F" font-weight="700">PROBLEM · SOLUTION</text>
  <g>
    <g transform="translate(70,308)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#16324F"/><text x="22" y="32" font-size="16" font-weight="700" fill="#16324F">Data-input system</text><text x="22" y="56" font-size="13.5" fill="#5A7085">Digitize BT raw data</text></g>
    <g transform="translate(70,392)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#2E6BA6"/><text x="22" y="32" font-size="16" font-weight="700" fill="#16324F">Ground-truth agreement</text><text x="22" y="56" font-size="13.5" fill="#5A7085">Documented BT·DS workflow</text></g>
    <g transform="translate(70,476)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#C8912E"/><text x="22" y="32" font-size="16" font-weight="700" fill="#16324F">5-stage data QC</text><text x="22" y="56" font-size="13.5" fill="#5A7085">1st/2nd cross-checks</text></g>
    <g transform="translate(70,560)"><rect width="260" height="72" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="72" rx="2.5" fill="#D9A94A"/><text x="22" y="32" font-size="16" font-weight="700" fill="#16324F">C++ minimal packages</text><text x="22" y="56" font-size="13.5" fill="#5A7085">Automated viz + docs</text></g>
  </g>

  <!-- CENTER -->
  <text x="410" y="292" font-size="17" letter-spacing="2" fill="#B0851F" font-weight="700">TWO-TRACK VALIDATION</text>
  <g transform="translate(410,304)">
    <rect x="0" y="0" width="450" height="160" rx="14" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.8"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#16324F">Statistical Testing</text>
    <text x="20" y="52" font-size="12.5" fill="#8A9AA8">χ² fit · Repeated-measures ANOVA · McNemar</text>
    <line x1="36" y1="138" x2="430" y2="138" stroke="#C6D2DE" stroke-width="1.8"/>
    <path d="M36 138 C110 138 118 74 180 74 C242 74 250 138 320 138" fill="#DCE8F4" stroke="#2E6BA6" stroke-width="2.5"/>
    <path d="M150 138 C224 138 232 90 294 90 C356 90 364 138 434 138" fill="#EDE2CB" stroke="#C8912E" stroke-width="2.5" opacity="0.85"/>
    <text x="235" y="66" font-size="13" font-weight="800" fill="#16324F">p &lt; 0.05</text>
  </g>
  <g transform="translate(410,484)">
    <rect x="0" y="0" width="450" height="188" rx="14" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.8"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#16324F">Switch Model · modules on/off · 10 scenarios</text>
    <g font-size="14.5" fill="#3A4A5A" font-weight="600">
      <g transform="translate(24,52)"><text x="0" y="16">Module 1</text><rect x="360" y="2" width="52" height="24" rx="12" fill="#2E6BA6"/><circle cx="400" cy="14" r="9" fill="#fff"/></g>
      <g transform="translate(24,84)"><text x="0" y="16">Module 2</text><rect x="360" y="2" width="52" height="24" rx="12" fill="#CBD6E2"/><circle cx="372" cy="14" r="9" fill="#fff"/></g>
      <g transform="translate(24,116)"><text x="0" y="16">Module 3</text><rect x="360" y="2" width="52" height="24" rx="12" fill="#2E6BA6"/><circle cx="400" cy="14" r="9" fill="#fff"/></g>
      <g transform="translate(24,148)"><text x="0" y="16">Module 8</text><rect x="360" y="2" width="52" height="24" rx="12" fill="#2E6BA6"/><circle cx="400" cy="14" r="9" fill="#fff"/></g>
    </g>
    <text x="240" y="176" font-size="12.5" fill="#8A9AA8" text-anchor="middle">Isolates 8 core modules' Ct &amp; call contribution</text>
  </g>

  <!-- RIGHT -->
  <text x="1030" y="292" font-size="18" letter-spacing="2" fill="#B0851F" font-weight="700">SOLUTION DESIGN</text>
  <g>
    <g transform="translate(1030,304)"><rect width="360" height="82" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#16324F"/><text x="24" y="34" font-size="18" font-weight="800" fill="#16324F">Statistical Validation</text><text x="24" y="60" font-size="14.5" fill="#5A7085">Algorithm risk definition + impact</text></g>
    <g transform="translate(1030,398)"><rect width="360" height="82" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#2E6BA6"/><text x="24" y="34" font-size="18" font-weight="800" fill="#16324F">Two parallel tracks</text><text x="24" y="60" font-size="14.5" fill="#5A7085">Structural + Statistical Testing</text></g>
    <g transform="translate(1030,492)"><rect width="360" height="82" rx="12" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><rect width="5" height="82" rx="2.5" fill="#C8912E"/><text x="24" y="34" font-size="18" font-weight="800" fill="#16324F">Report automation</text><text x="24" y="60" font-size="14.5" fill="#5A7085">Quarto 200p V&amp;V semi-auto</text></g>
  </g>
  <!-- shield -->
  <g transform="translate(1420,300)">
    <path d="M55 0 L110 20 C110 96 82 138 55 150 C28 138 0 96 0 20 Z" fill="url(#shield)"/>
    <path d="M33 74 L49 90 L82 54" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="124" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">FDA</text>
  </g>
  <text x="1420" y="474" font-size="14" fill="#5A7085" text-anchor="start">EN62304 ·</text>
  <text x="1420" y="494" font-size="14" fill="#5A7085">Software Validation</text>
  <g transform="translate(1030,594)"><rect width="500" height="78" rx="14" fill="#F6EEDC" stroke="#C8912E" stroke-width="1.8"/><text x="24" y="32" font-size="14" letter-spacing="2" fill="#B0851F" font-weight="700">OUTCOME</text><text x="24" y="60" font-size="16" fill="#5A4A20" font-weight="600">First in-house algorithm + reagent evaluation system</text></g>

  <!-- METRICS -->
  <rect x="70" y="720" width="1460" height="116" rx="16" fill="#F1F5FA" stroke="#DCE4EC" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="252" y="778" font-size="38" font-weight="800" fill="#16324F">87.5% ↓</text><text x="252" y="810" font-size="15" fill="#5A7085">Validation 6 mo → 3 wk</text>
    <line x1="435" y1="748" x2="435" y2="808" stroke="#DCE4EC" stroke-width="1.5"/>
    <text x="617" y="778" font-size="38" font-weight="800" fill="#2E6BA6">99.2%</text><text x="617" y="810" font-size="15" fill="#5A7085">Safety statistical confidence</text>
    <line x1="800" y1="748" x2="800" y2="808" stroke="#DCE4EC" stroke-width="1.5"/>
    <text x="982" y="778" font-size="38" font-weight="800" fill="#C8912E">200p</text><text x="982" y="810" font-size="15" fill="#5A7085">V&amp;V report semi-auto</text>
    <line x1="1165" y1="748" x2="1165" y2="808" stroke="#DCE4EC" stroke-width="1.5"/>
    <text x="1347" y="778" font-size="38" font-weight="800" fill="#4A6B8C">16</text><text x="1347" y="810" font-size="15" fill="#5A7085">Cross-functional team</text>
  </g>

  <!-- TECH -->
  <text x="70" y="888" font-size="15" letter-spacing="3" fill="#8A9AA8" font-weight="700">TECH STACK</text>
  <g font-size="17" fill="#3C4C5C" font-weight="600">
    <text x="70" y="928">R</text><text x="140" y="928">Python</text><text x="255" y="928">Matlab</text><text x="370" y="928">Apache Airflow</text><text x="565" y="928">Quarto</text><text x="680" y="928">ANOVA</text><text x="790" y="928">McNemar</text><text x="920" y="928">Cochran-Mantel-Haenszel</text><text x="1230" y="928">EN62304</text>
  </g>
  <g fill="#16324F"><circle cx="58" cy="923" r="3"/><circle cx="128" cy="923" r="3"/><circle cx="243" cy="923" r="3"/><circle cx="358" cy="923" r="3"/><circle cx="553" cy="923" r="3"/><circle cx="668" cy="923" r="3"/><circle cx="778" cy="923" r="3"/><circle cx="908" cy="923" r="3"/><circle cx="1218" cy="923" r="3"/></g>
</svg>
