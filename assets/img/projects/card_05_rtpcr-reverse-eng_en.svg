<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFBF9"/>
      <stop offset="1" stop-color="#EEECE6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg5)"/>
  <rect x="0" y="0" width="10" height="720" fill="#B07A2B"/>
  <text x="70" y="86" font-size="24" letter-spacing="3" fill="#8A5E1E" font-weight="700">05 · REVERSE ENGINEERING / MODELING</text>
  <line x1="70" y1="104" x2="410" y2="104" stroke="#B07A2B" stroke-width="3"/>

  <!-- legacy tangled card -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="430" height="300" rx="14" fill="#F4F1EA" stroke="#D8CDB6" stroke-width="2"/>
    <text x="20" y="34" font-size="17" font-weight="700" fill="#7A5A20">Legacy Matlab (undocumented)</text>
    <!-- spaghetti -->
    <path d="M40 90 C120 60 90 160 180 130 C260 105 200 210 300 175 C370 150 340 240 400 210" fill="none" stroke="#B99B63" stroke-width="3"/>
    <path d="M40 150 C130 190 100 90 200 120 C280 145 250 250 350 220 C390 208 360 130 400 150" fill="none" stroke="#C9AE78" stroke-width="3"/>
    <path d="M40 230 C110 200 150 270 230 240 C300 214 280 130 360 160" fill="none" stroke="#D8C08C" stroke-width="3"/>
    <text x="60" y="118" font-size="22" fill="#A07C3A" font-weight="800">?</text>
    <text x="250" y="200" font-size="22" fill="#A07C3A" font-weight="800">?</text>
    <text x="215" y="278" font-size="14" fill="#8A6A2A" text-anchor="middle" font-weight="700">10+ correction stages · 50+ parameters</text>
  </g>

  <!-- arrow -->
  <g fill="#8A5E1E" stroke="#8A5E1E">
    <line x1="520" y1="300" x2="585" y2="300" stroke-width="3"/>
    <polygon points="585,292 603,300 585,308"/>
    <text x="560" y="284" font-size="13" text-anchor="middle" font-weight="700">80% reverse-eng</text>
  </g>

  <!-- clean model card -->
  <g transform="translate(620,150)">
    <rect x="0" y="0" width="500" height="300" rx="14" fill="#ffffff" stroke="#CBD9E6" stroke-width="2"/>
    <text x="20" y="34" font-size="17" font-weight="700" fill="#16324F">Hybrid statistical model (Joint estimation)</text>
    <line x1="40" y1="250" x2="470" y2="250" stroke="#B7C6D6" stroke-width="2"/>
    <line x1="40" y1="70" x2="40" y2="250" stroke="#B7C6D6" stroke-width="2"/>
    <!-- clean sigmoid -->
    <path d="M40 240 Q170 238 240 200 Q300 160 330 100 Q345 78 470 74" fill="none" stroke="#2E6BA6" stroke-width="4"/>
    <!-- param markers -->
    <circle cx="180" cy="234" r="6" fill="#3FA7A0"/><text x="150" y="222" font-size="13" fill="#2E8C84" font-weight="700">plateau0</text>
    <circle cx="288" cy="150" r="6" fill="#E8912D"/><text x="298" y="150" font-size="13" fill="#B07A2B" font-weight="700">inflection β</text>
    <circle cx="450" cy="76" r="6" fill="#2E6BA6"/><text x="360" y="66" font-size="13" fill="#2E6BA6" font-weight="700">plateau1</text>
    <text x="245" y="285" font-size="14" fill="#16324F" text-anchor="middle" font-weight="700">f(x)=g3(g2(g1(x)))+sigmoid(x,β)</text>
  </g>

  <text x="70" y="530" font-size="40" font-weight="800" fill="#3A2E14">RT-PCR Reverse Engineering &amp; Statistical Redesign</text>
  <text x="70" y="570" font-size="22" fill="#8A7A55">Mechanistic + statistical hybrid · joint estimation removes bias · 2021.10–2023.04</text>

  <g font-weight="800" text-anchor="middle">
    <rect x="70" y="606" width="150" height="66" rx="10" fill="#3A2E14"/>
    <text x="145" y="642" font-size="26" fill="#ffffff">80%</text>
    <text x="145" y="662" font-size="12" fill="#CDBE98" font-weight="500">Legacy documented</text>
    <rect x="232" y="606" width="190" height="66" rx="10" fill="#B07A2B"/>
    <text x="327" y="642" font-size="23" fill="#ffffff">Joint Est.</text>
    <text x="327" y="662" font-size="12" fill="#F0E2C7" font-weight="500">Sequential → joint</text>
    <rect x="434" y="606" width="200" height="66" rx="10" fill="#2E6BA6"/>
    <text x="534" y="642" font-size="23" fill="#ffffff">10+ / 50+</text>
    <text x="534" y="662" font-size="12" fill="#CFE0EF" font-weight="500">Stages / params</text>
  </g>
</svg>
